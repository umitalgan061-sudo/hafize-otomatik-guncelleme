name: CI/CD Pipeline - Hafize Otomatik Güncelleme

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    name: Lint ve Test
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu checkout et
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Bağımlılıkları kur
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Lint çalıştır
        run: npm run lint --if-present || true

      - name: Testleri çalıştır
        run: npm test --if-present -- --passWithNoTests || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Depoyu checkout et
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Bağımlılıkları kur
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Production build al
        run: npm run build --if-present || echo "Build scripti yok, statik dosyalar olduğu gibi deploy edilecek"

      - name: Build artifact'ını yükle
        uses: actions/upload-artifact@v4
        with:
          name: firebase-deploy-package
          path: |
            **/*
            !node_modules
            !.github
            !.git
          retention-days: 7

  deploy-firebase:
    name: Firebase Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy artifact'ını indir
        uses: actions/download-artifact@v4
        with:
          name: firebase-deploy-package
          path: deploy-package

      - name: Firebase CLI kur
        run: npm install -g firebase-tools@13.9.0

      - name: Firebase'e deploy et
        id: firebase-deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "${FIREBASE_SERVICE_ACCOUNT}" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          cd deploy-package
          firebase deploy --project="${FIREBASE_PROJECT_ID}" --only=hosting --non-interactive

      - name: Başarılı release SHA'sını kaydet
        if: success()
        run: |
          echo "LAST_SUCCESS_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "LAST_SUCCESS_RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV
          echo "DEPLOY_URL=https://${FIREBASE_PROJECT_ID}.web.app" >> $GITHUB_ENV

      - name: Son başarılı SHA'yı artifact olarak sakla
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: last-successful-deploy
          path: deploy-package
          retention-days: 30

  rollback:
    name: Rollback (Hata Durumunda)
    runs-on: ubuntu-latest
    needs: deploy-firebase
    if: failure()
    steps:
      - name: Son başarılı deploy artifact'ını indir
        uses: actions/download-artifact@v4
        with:
          name: last-successful-deploy
          path: rollback-package

      - name: jq kur (JSON parse için)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Firebase CLI kur
        run: npm install -g firebase-tools@13.9.0

      - name: Firebase release listesini al
        id: releases
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "${FIREBASE_SERVICE_ACCOUNT}" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          RELEASES=$(firebase hosting:releases:list --project="${FIREBASE_PROJECT_ID}" --json 2>/dev/null || echo '{"releases":[]}')
          echo "releases_json<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Son başarılı release'i bul ve rollback et
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RELEASES_JSON: ${{ steps.releases.outputs.releases_json }}
        run: |
          echo "${FIREBASE_SERVICE_ACCOUNT}" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          
          # JSON'dan son başarılı release'i parse et
          LAST_SUCCESS=$(echo "$RELEASES_JSON" | jq -r '.releases[] | select(.type=="RELEASE" and .version.name != "") | .version.name' | head -n 1)
          
          if [ -n "$LAST_SUCCESS" ] && [ "$LAST_SUCCESS" != "null" ]; then
            echo "Rollback yapılıyor: $LAST_SUCCESS"
            firebase hosting:clone --project="${FIREBASE_PROJECT_ID}" --source="${LAST_SUCCESS}" --target="live"
            echo "Rollback tamamlandı: $LAST_SUCCESS"
          else
            echo "Rollback için başarılı release bulunamadı, artifact'tan yeniden deploy deneniyor..."
            cd rollback-package
            firebase deploy --project="${FIREBASE_PROJECT_ID}" --only=hosting --non-interactive
          fi

      - name: Rollback bilgisi kaydet (dashboard için)
        if: success()
        run: |
          echo "ROLLBACK_EXECUTED=true" >> $GITHUB_ENV
          echo "ROLLBACK_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "ROLLBACK_REASON=Deploy failed, auto rollback triggered" >> $GITHUB_ENV

      - name: Rollback bildirimi
        run: |
          echo "🔄 Rollback gerçekleştirildi. Workflow: ${{ github.workflow }} Run: ${{ github.run_id }}"
          echo "Deploy URL: https://${FIREBASE_PROJECT_ID}.web.app"
          echo "Rollback zaman damgası: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  status-badge:
    name: Status Badge Oluştur
    runs-on: ubuntu-latest
    needs: [deploy-firebase, rollback]
    if: always()
    steps:
      - name: Workflow durumunu belirle
        id: status
        run: |
          if [ "${{ needs.deploy-firebase.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=brightgreen" >> $GITHUB_OUTPUT
            echo "label=deploy" >> $GITHUB_OUTPUT
          elif [ "${{ needs.rollback.result }}" = "success" ]; then
            echo "status=rollback" >> $GITHUB_OUTPUT
            echo "color=orange" >> $GITHUB_OUTPUT
            echo "label=rollback" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy-firebase.result }}" = "failure" ] && [ "${{ needs.rollback.result }}" = "failure" ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "color=red" >> $GITHUB_OUTPUT
            echo "label=failed" >> $GITHUB_OUTPUT
          else
            echo "status=unknown" >> $GITHUB_OUTPUT
            echo "color=lightgrey" >> $GITHUB_OUTPUT
            echo "label=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Rollback bilgisi hazırla
        id: rollback-info
        run: |
          if [ "${{ needs.rollback.result }}" = "success" ]; then
            echo "executed=true" >> $GITHUB_OUTPUT
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
            echo "reason=Deploy failed, auto rollback triggered" >> $GITHUB_OUTPUT
          else
            echo "executed=false" >> $GITHUB_OUTPUT
            echo "timestamp=" >> $GITHUB_OUTPUT
            echo "reason=" >> $GITHUB_OUTPUT
          fi

      - name: Deploy bilgisi hazırla
        id: deploy-info
        run: |
          if [ "${{ needs.deploy-firebase.result }}" = "success" ]; then
            echo "executed=true" >> $GITHUB_OUTPUT
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
            echo "commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "executed=false" >> $GITHUB_OUTPUT
            echo "timestamp=" >> $GITHUB_OUTPUT
            echo "commit=" >> $GITHUB_OUTPUT
          fi

      - name: Badge JSON'ı oluştur
        run: |
          ROLLBACK_INFO='{"executed": false}'
          if [ "${{ steps.rollback-info.outputs.executed }}" = "true" ]; then
            ROLLBACK_INFO=$(cat << RBEOF
            {
              "executed": true,
              "timestamp": "${{ steps.rollback-info.outputs.timestamp }}",
              "reason": "${{ steps.rollback-info.outputs.reason }}"
            }
            RBEOF
            )
          fi
          
          DEPLOY_INFO='{"executed": false}'
          if [ "${{ steps.deploy-info.outputs.executed }}" = "true" ]; then
            DEPLOY_INFO=$(cat << DBEOF
            {
              "executed": true,
              "timestamp": "${{ steps.deploy-info.outputs.timestamp }}",
              "commit": "${{ steps.deploy-info.outputs.commit }}"
            }
            DBEOF
            )
          fi
          
          cat > badge.json << EOF
          {
            "schemaVersion": 1,
            "label": "${{ steps.status.outputs.label }}",
            "message": "${{ steps.status.outputs.status }}",
            "color": "${{ steps.status.outputs.color }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "runId": "${{ github.run_id }}",
            "commitSha": "${{ github.sha }}",
            "rollback": $ROLLBACK_INFO,
            "deploy": $DEPLOY_INFO
          }
          EOF

      - name: Badge artifact'ını yükle
        uses: actions/upload-artifact@v4
        with:
          name: workflow-badge
          path: badge.json
          retention-days: 7

  notify:
    name: Bildirim
    runs-on: ubuntu-latest
    needs: [deploy-firebase, rollback]
    if: always()
    steps:
      - name: Sonuç özeti
        run: |
          DEPLOY_RESULT="${{ needs.deploy-firebase.result }}"
          ROLLBACK_RESULT="${{ needs.rollback.result }}"
          
          if [ "$DEPLOY_RESULT" = "success" ]; then
            echo "✅ Deploy başarılı: https://${FIREBASE_PROJECT_ID}.web.app"
            echo "Commit: ${{ github.sha }}"
            echo "Run: ${{ github.run_id }}"
          elif [ "$ROLLBACK_RESULT" = "success" ]; then
            echo "🔄 Deploy başarısız, rollback başarılı"
            echo "Commit: ${{ github.sha }}"
            echo "Run: ${{ github.run_id }}"
          else
            echo "❌ Deploy ve rollback her ikisi de başarısız"
            echo "Commit: ${{ github.sha }}"
            echo "Run: ${{ github.run_id }}"
            exit 1
          fi