name: CI/CD Pipeline - Hafize Otomatik Güncelleme

on:
  schedule:
    # Her 30 dakikada bir çalış (0, 30 dakika)
    - cron: '*/30 * * * *'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      forceDeploy:
        description: 'Zorla deploy et (testleri atla)'
        type: boolean
        required: false
        default: false
      rollback:
        description: 'Son başarılı release\'e rollback yap'
        type: boolean
        required: false
        default: false

env:
  NODE_VERSION: '20'
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # 1. Lint ve kod kalitesi kontrolü
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        timeout-minutes: 5

      - name: Run ESLint
        run: npx eslint . --ext .js --max-warnings 0
        continue-on-error: false

      - name: Check formatting (Prettier)
        run: npx prettier --check .
        continue-on-error: false

  # 2. Testleri çalıştır
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        timeout-minutes: 5

      - name: Run unit tests
        run: npm test -- --run --reporter=verbose
        env:
          CI: true
        continue-on-error: false

      - name: Run E2E tests (headless)
        run: npx playwright test --reporter=line
        continue-on-error: true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # 3. Build işlemi
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        timeout-minutes: 5

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          BUILD_TIME: ${{ github.event.workflow_run.run_started_at || github.event.head_commit.timestamp }}

      - name: Verify build output
        run: |
          if [ ! -d "dist" ] && [ ! -d "build" ] && [ ! -d "public" ]; then
            echo "❌ Build output klasörü bulunamadı (dist/build/public)"
            exit 1
          fi
          echo "✅ Build çıktısı doğrulandı"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            build/
            public/
          retention-days: 7

  # 4. Deploy to Firebase Hosting
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name != 'schedule' || github.repository == 'umitalgan061-sudo/hafize-otomatik-guncelleme'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./dist

      - name: Setup Firebase CLI
        uses: firebase-actions/setup-firebase@v1
        with:
          version: 'latest'

      - name: Deploy to Firebase Hosting
        id: firebase-deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: ./dist
          expires: 30d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record deployment metadata
        run: |
          echo "DEPLOY_URL=${{ steps.firebase-deploy.outputs.details_url }}" >> $GITHUB_ENV
          echo "DEPLOY_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deploy başarılı: ${{ env.DEPLOY_URL }}"
          echo "🕐 Deploy zamanı: ${{ env.DEPLOY_TIME }}"
          echo "📦 Commit: ${{ env.COMMIT_SHA }}"

  # 5. Rollback on failure
  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    if: failure() && needs.deploy.result == 'failure'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Firebase CLI
        uses: firebase-actions/setup-firebase@v1
        with:
          version: 'latest'

      - name: Get last successful release
        id: get-release
        run: |
          echo "🔍 Son başarılı release aranıyor..."
          RELEASES=$(firebase hosting:releases:list --project=${{ env.FIREBASE_PROJECT_ID }} --json 2>/dev/null | jq -r '.releases[] | select(.type=="RELEASE" and .releaseTime) | .name' | head -5)
          if [ -z "$RELEASES" ]; then
            echo "❌ Hiç başarılı release bulunamadı"
            exit 1
          fi
          LAST_SUCCESS=$(echo "$RELEASES" | head -1)
          echo "✅ Son başarılı release: $LAST_SUCCESS"
          echo "release_name=$LAST_SUCCESS" >> $GITHUB_OUTPUT

      - name: Trigger rollback (clone last successful release)
        run: |
          echo "🔄 Rollback tetikleniyor: ${{ steps.get-release.outputs.release_name }}"
          firebase hosting:clone ${{ steps.get-release.outputs.release_name }} --project=${{ env.FIREBASE_PROJECT_ID }}
          echo "✅ Rollback tamamlandı"

      - name: Notify rollback
        run: |
          echo "⚠️ Deploy başarısız, rollback yapıldı"
          echo "🔄 Geri alınan release: ${{ steps.get-release.outputs.release_name }}"
          echo "🕐 Rollback zamanı: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # 6. Manual rollback trigger (workflow_dispatch ile)
  manual-rollback:
    name: Manual Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.inputs.rollback == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Firebase CLI
        uses: firebase-actions/setup-firebase@v1
        with:
          version: 'latest'

      - name: Get last successful release
        id: get-release
        run: |
          RELEASES=$(firebase hosting:releases:list --project=${{ env.FIREBASE_PROJECT_ID }} --json 2>/dev/null | jq -r '.releases[] | select(.type=="RELEASE" and .releaseTime) | .name' | head -1)
          if [ -z "$RELEASES" ]; then
            echo "❌ Hiç başarılı release bulunamadı"
            exit 1
          fi
          echo "release_name=$RELEASES" >> $GITHUB_OUTPUT

      - name: Trigger rollback
        run: |
          firebase hosting:clone ${{ steps.get-release.outputs.release_name }} --project=${{ env.FIREBASE_PROJECT_ID }}
          echo "✅ Manuel rollback tamamlandı: ${{ steps.get-release.outputs.release_name }}"

  # 7. Status badge ve metadata güncelleme
  update-status:
    name: Update Status & Badges
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy, rollback-on-failure]
    if: always()
    steps:
      - name: Determine workflow status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "badge=success" >> $GITHUB_OUTPUT
            echo "message=Deploy başarılı" >> $GITHUB_OUTPUT
          elif [ "${{ needs.rollback-on-failure.result }}" == "success" ]; then
            echo "status=rollback" >> $GITHUB_OUTPUT
            echo "badge=warning" >> $GITHUB_OUTPUT
            echo "message=Deploy başarısız, rollback yapıldı" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "badge=error" >> $GITHUB_OUTPUT
            echo "message=Deploy ve rollback başarısız" >> $GITHUB_OUTPUT
          fi

      - name: Update deployment status (GitHub API)
        if: github.event_name != 'schedule'
        run: |
          STATUS="${{ steps.status.outputs.status }}"
          MESSAGE="${{ steps.status.outputs.message }}"
          echo "📊 Workflow sonucu: $STATUS - $MESSAGE"

      - name: Generate status badge (shields.io)
        run: |
          BADGE="${{ steps.status.outputs.badge }}"
          echo "![Workflow Status](https://img.shields.io/badge/workflow-${BADGE// /%20}-${BADGE})" > workflow-badge.md
          cat workflow-badge.md

      - name: Upload status badge
        uses: actions/upload-artifact@v4
        with:
          name: workflow-badge
          path: workflow-badge.md
          retention-days: 30

  # 8. Cleanup ve raporlama
  cleanup:
    name: Cleanup & Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, build, deploy, rollback-on-failure, manual-rollback, update-status]
    if: always()
    steps:
      - name: Workflow summary
        run: |
          echo "## 📋 Workflow Özeti" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Durum |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rollback (auto) | ${{ needs.rollback-on-failure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rollback (manual) | ${{ needs.manual-rollback.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status Update | ${{ needs.update-status.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tetikleyici:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Zaman:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup old artifacts
        run: |
          echo "🧹 Eski artifact'lar temizleniyor..."
          # GitHub Actions otomatik olarak retention-days'e göre temizler
          # Manuel temizleme gerekirse buraya eklenebilir

      - name: Rate limit check
        run: |
          echo "🔍 API rate limit kontrolü..."
          REMAINING=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/rate_limit | jq -r '.resources.core.remaining')
          RESET=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/rate_limit | jq -r '.resources.core.reset')
          echo "Kalan istek: $REMAINING"
          echo "Reset zamanı: $(date -d @$RESET -u)"
          if [ "$REMAINING" -lt 100 ]; then
            echo "⚠️ Rate limit düşük: $REMAINING"
          fi

# Concurrency control: aynı workflow'dan sadece bir tane çalışsın
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

# Permissions
permissions:
  contents: read
  actions: read
  deployments: write
  statuses: write
  checks: write
  pull-requests: write
  id-token: write